<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="Editor polygon 2D sederhana untuk menghasilkan vertices dan indices OpenGL."
    />
    <title>MeshSketch</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace">
        <aside class="panel tools-panel" aria-label="Alat dan objek">
          <section class="sidebar-section">
            <div class="section-heading">
              <div>
                <div class="eyebrow">EDITOR</div>
                <h2>Tools</h2>
              </div>
            </div>
            <div class="mode-buttons" role="group" aria-label="Mode editor">
              <button
                id="selectModeBtn"
                class="button mode active"
                aria-pressed="true"
                type="button"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                >
                  <path d="M5 3l14 9-7.2 1.7L8.9 21 5 3Z" />
                </svg>
                <span>Select</span>
              </button>
              <button
                id="polygonModeBtn"
                class="button mode"
                aria-pressed="false"
                type="button"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                >
                  <path d="m4 17 6-12 10 5-4 10-12-3Z" />
                  <circle cx="4" cy="17" r="1.4" fill="currentColor" />
                  <circle cx="10" cy="5" r="1.4" fill="currentColor" />
                  <circle cx="20" cy="10" r="1.4" fill="currentColor" />
                </svg>
                <span>Polygon</span>
              </button>
            </div>
            <div class="field-label">Warna bentuk baru</div>
            <label class="color-input-wrap" for="newColor"
              ><input
                type="color"
                id="newColor"
                value="#ef4444"
                aria-label="Warna polygon baru" /><span id="newColorHex"
                >#EF4444</span
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="m7 10 5 5 5-5" /></svg
            ></label>
            <div class="draft-actions hidden" id="draftActions">
              <div class="hint">
                <strong id="draftCount">0 titik</strong> dipilih · minimal 3
                titik.
              </div>
              <div class="action-row">
                <button
                  type="button"
                  class="button button-primary"
                  id="finishPolygonBtn"
                >
                  Selesai <kbd>↵</kbd></button
                ><button
                  type="button"
                  class="button button-outline"
                  id="cancelPolygonBtn"
                >
                  Batal
                </button>
              </div>
            </div>
          </section>

          <section class="sidebar-section">
            <div class="section-heading"><h2>Canvas settings</h2></div>
            <label class="field-label" for="viewportSelect">Viewport</label>
            <select
              id="viewportSelect"
              class="select"
              aria-label="Ukuran viewport referensi"
            >
              <option value="800x600" selected>800 × 600 (4:3)</option>
              <option value="640x480">640 × 480 (4:3)</option>
              <option value="1280x720">1280 × 720 (16:9)</option>
              <option value="600x600">600 × 600 (1:1)</option>
            </select>
            <label class="toggle-row" for="snapToggle"
              ><span>Snap to grid</span
              ><input type="checkbox" id="snapToggle" checked /><span
                class="switch-track"
                aria-hidden="true"
              ></span
            ></label>
            <label class="toggle-row" for="gridToggle"
              ><span>Show grid</span
              ><input type="checkbox" id="gridToggle" checked /><span
                class="switch-track"
                aria-hidden="true"
              ></span
            ></label>
          </section>

          <section class="sidebar-section objects-section">
            <div class="row-between">
              <h2>Layers</h2>
              <span class="counter" id="shapeCount">0</span>
            </div>
            <div
              class="shape-list"
              id="shapeList"
              aria-label="Daftar polygon"
            ></div>
            <div class="selected-editor hidden" id="selectedEditor">
              <div class="property-heading">Properties</div>
              <label class="field-label" for="shapeName">Nama objek</label>
              <input
                id="shapeName"
                class="input"
                type="text"
                maxlength="60"
                aria-label="Nama polygon"
              />
              <div class="property-row">
                <label for="shapeColor">Warna</label
                ><input type="color" id="shapeColor" aria-label="Warna objek" />
              </div>
              <div class="property-row">
                <span>Susunan layer</span>
                <div class="action-row compact">
                  <button
                    type="button"
                    class="button button-outline icon-button"
                    id="layerDownBtn"
                    title="Kirim ke belakang"
                    aria-label="Kirim ke belakang"
                  >
                    ↓</button
                  ><button
                    type="button"
                    class="button button-outline icon-button"
                    id="layerUpBtn"
                    title="Bawa ke depan"
                    aria-label="Bawa ke depan"
                  >
                    ↑
                  </button>
                </div>
              </div>
              <div class="selected-vertex hidden" id="selectedVertexEditor">
                <div class="field-label">
                  Vertex terpilih <span id="selectedVertexIndex"></span>
                </div>
                <div class="coordinate-fields">
                  <label
                    >X
                    <input
                      type="number"
                      step="0.05"
                      min="-1"
                      max="1"
                      id="vertexX"
                      class="input"
                  /></label>
                  <label
                    >Y
                    <input
                      type="number"
                      step="0.05"
                      min="-1"
                      max="1"
                      id="vertexY"
                      class="input"
                  /></label>
                </div>
              </div>
              <div class="action-row">
                <button
                  class="button button-outline"
                  type="button"
                  id="duplicateBtn"
                >
                  Duplikat</button
                ><button
                  class="button button-danger"
                  type="button"
                  id="deleteBtn"
                >
                  Hapus
                </button>
              </div>
            </div>
          </section>
          <div class="sidebar-help">
            <div class="shortcuts">
              <kbd>Enter</kbd> selesai <kbd>Esc</kbd> batal
              <kbd>Ctrl Z</kbd> undo
            </div>
          </div>
        </aside>

        <section class="main-panel" aria-label="Canvas editor">
          <div class="canvas-toolbar">
            <div class="history-actions">
              <button
                class="button button-outline icon-button"
                id="undoBtn"
                type="button"
                title="Undo (Ctrl+Z)"
                aria-label="Undo"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 14 4 9l5-5" />
                  <path d="M4 9h10a6 6 0 0 1 0 12h-2" />
                </svg>
              </button>
              <button
                class="button button-outline icon-button"
                id="redoBtn"
                type="button"
                title="Redo (Ctrl+Y)"
                aria-label="Redo"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m15 14 5-5-5-5" />
                  <path d="M20 9H10a6 6 0 0 0 0 12h2" />
                </svg>
              </button>
            </div>
          </div>
          <div class="stage-area">
            <div class="canvas-frame" id="canvasFrame">
              <canvas
                id="canvas"
                aria-label="Editor geometri polygon"
                tabindex="0"
              ></canvas>
              <div class="canvas-corner">X → &nbsp; Y ↑</div>
            </div>
          </div>
          <div class="canvas-footer">
            <span class="coordinate-pill" id="cursorPosition"
              >X: — &nbsp; Y: —</span
            ><span id="editorStatus" role="status"
              >Pilih Polygon untuk menambah bentuk.</span
            >
          </div>
          <div class="info-row">
            <div><strong id="vertexCount">0</strong><span>Vertices</span></div>
            <div>
              <strong id="triangleCount">0</strong><span>Triangles</span>
            </div>
            <div><strong id="indexCount">0</strong><span>Indices</span></div>
            <div>
              <strong id="ratioLabel">4:3</strong><span>Aspect ratio</span>
            </div>
          </div>
        </section>

        <aside class="panel export-panel" aria-label="Ekspor kode">
          <div class="section-heading export-heading">
            <div><div class="eyebrow">OUTPUT</div></div>
          </div>

          <label class="field-label" for="codeOutput"
            >Vertices &amp; indices</label
          >
          <div class="code-frame">
            <div class="code-header">
              <span class="code-dot"></span> mesh.cpp
              <span class="code-lang">C++</span>
            </div>
            <textarea
              id="codeOutput"
              class="code-output"
              readonly
              spellcheck="false"
              wrap="off"
              aria-label="Kode C++ vertices dan indices"
            ></textarea>
          </div>
          <button id="copyBtn" class="button button-primary full" type="button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="8" y="8" width="12" height="12" rx="2" />
              <path
                d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
              />
            </svg>
            Salin kode C++
          </button>
          <div class="export-buttons">
            <button
              id="cppDownloadBtn"
              class="button button-outline"
              type="button"
            >
              Download .h</button
            ><button
              id="jsonDownloadBtn"
              class="button button-outline"
              type="button"
            >
              Simpan JSON
            </button>
          </div>
          <div class="extra-actions">
            <button
              id="jsonImportBtn"
              class="button button-outline full"
              type="button"
            >
              Buka project JSON</button
            ><input
              id="jsonInput"
              type="file"
              accept=".json,application/json"
              hidden
            /><button
              id="pngDownloadBtn"
              class="button button-outline full"
              type="button"
            >
              Download preview PNG
            </button>
          </div>
          <div class="bottom-actions">
            <button
              class="button button-ghost icon-button"
              id="themeToggleBtn"
              type="button"
              aria-label="Aktifkan mode gelap"
              title="Ganti tema"
            >
              <svg
                id="themeIcon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20.9 13.2A9 9 0 0 1 10.8 3.1 9 9 0 1 0 20.9 13.2Z" />
              </svg>
            </button>
            <button class="button button-outline" id="resetBtn" type="button">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              >
                <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              <span>Reset</span>
            </button>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
